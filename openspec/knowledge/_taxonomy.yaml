# Таксономия Knowledge Base — kit (метапроект без выгрузки src/*/cf).
# Re-sync после появления базовых конфигураций: /opsx:knowledge-init
# Формат: .cursor/rules/knowledge-format.mdc

version: 1
updated-at: "2026-08-30T11:19:00+09:00"

domains:
  - id: kit
    title: Cursor kit (метапроект)
    source: .cursor
    owner: project
    subdomains:
      - chat
      - scenario-map
      - workflow
      - common

cross:
  scope-rules:
    - >
      Факты с anchor в домене <base>_cf описывают типовое поведение,
      владелец — вендор. Перехваты и расширение этого поведения
      описываются в доменах расширений и связываются через related.kb.
    - >
      Факт размещается в домене по anchor.path (где живёт код),
      а не по тому, кто его вызывает.
  fallback-domain: kit
